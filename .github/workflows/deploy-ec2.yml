
name: Deploy to EC2

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            IMAGE_TAG="${{ inputs.image_tag }}"
            DOMAIN="13.61.25.64.nip.io"

            SSL_CERT="/etc/letsencrypt/live/${DOMAIN}/fullchain.pem"
            SSL_KEY="/etc/letsencrypt/live/${DOMAIN}/privkey.pem"

            SERVER_IMAGE="${{ secrets.DOCKER_USERNAME }}/ai-resume-server:${IMAGE_TAG}"
            CLIENT_IMAGE="${{ secrets.DOCKER_USERNAME }}/ai-resume-client:${IMAGE_TAG}"

            echo "=========================================="
            echo "Deploying commit: ${IMAGE_TAG}"
            echo "Domain: ${DOMAIN}"
            echo "=========================================="

            # ---------------------------------------------------------
            # 1. Update packages
            # ---------------------------------------------------------

            echo "Updating packages..."
            sudo apt update -y


            # ---------------------------------------------------------
            # 2. Install Docker if missing
            # ---------------------------------------------------------

            echo "Checking Docker..."

            if ! command -v docker >/dev/null 2>&1; then
              sudo apt install docker.io -y
              sudo systemctl enable docker
              sudo systemctl start docker
            fi

            sudo systemctl start docker || true


            # ---------------------------------------------------------
            # 3. Install Docker Compose if missing
            # ---------------------------------------------------------

            echo "Checking Docker Compose..."

            if ! docker compose version >/dev/null 2>&1; then
              sudo apt install docker-compose-v2 -y || \
              sudo apt install docker-compose-plugin -y
            fi


            # ---------------------------------------------------------
            # 4. Install Nginx if missing
            # ---------------------------------------------------------

            echo "Checking Nginx..."

            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt install nginx -y
              sudo systemctl enable nginx
            fi


            # ---------------------------------------------------------
            # 5. Install Certbot if missing
            # ---------------------------------------------------------

            echo "Checking Certbot..."

            if ! command -v certbot >/dev/null 2>&1; then
              sudo apt install certbot python3-certbot-nginx -y
            fi


            # ---------------------------------------------------------
            # 6. Verify SSL certificate
            # ---------------------------------------------------------

            echo "Checking SSL certificate..."

            if [ ! -f "$SSL_CERT" ] || [ ! -f "$SSL_KEY" ]; then
              echo "ERROR: SSL certificate not found!"
              echo "Expected:"
              echo "  $SSL_CERT"
              echo "  $SSL_KEY"
              echo ""
              echo "Deployment stopped to prevent disabling HTTPS."
              exit 1
            fi

            echo "SSL certificate found."

            sudo openssl x509 \
              -in "$SSL_CERT" \
              -noout \
              -subject \
              -issuer \
              -dates


            # ---------------------------------------------------------
            # 7. Setup application directory
            # ---------------------------------------------------------

            echo "Creating application directory..."

            mkdir -p ~/ai-resume-app/uploads
            cd ~/ai-resume-app


            # ---------------------------------------------------------
            # 8. Create .env
            # ---------------------------------------------------------

            echo "Creating .env..."

            {
              echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}"
              echo "PORT=${{ secrets.PORT }}"
              echo "SERVER_URL=${{ secrets.SERVER_URL }}"
              echo "GOOGLE_REDIRECT_URI=${{ secrets.GOOGLE_REDIRECT_URI }}"
              echo "MONGO_URI=${{ secrets.MONGO_URI }}"
              echo "JWT_SECRET=${{ secrets.JWT_SECRET }}"
              echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}"
              echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}"
              echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}"
              echo "CLIENT_URL=${{ secrets.CLIENT_URL }}"
            } > .env

            chmod 600 .env


            # ---------------------------------------------------------
            # 9. Create docker-compose.yml
            # ---------------------------------------------------------

            echo "Creating docker-compose.yml..."

            {
              echo "services:"
              echo "  server:"
              echo "    image: ${SERVER_IMAGE}"
              echo "    container_name: ai-resume-server"
              echo "    env_file:"
              echo "      - .env"
              echo "    volumes:"
              echo "      - ./uploads:/app/uploads"
              echo "    ports:"
              echo '      - "127.0.0.1:5000:5000"'
              echo "    restart: unless-stopped"
              echo ""

              echo "  client:"
              echo "    image: ${CLIENT_IMAGE}"
              echo "    container_name: ai-resume-client"
              echo "    ports:"
              echo '      - "127.0.0.1:5173:80"'
              echo "    depends_on:"
              echo "      - server"
              echo "    restart: unless-stopped"
              echo ""

              echo "  mongo:"
              echo "    image: mongo:7"
              echo "    container_name: ai-resume-mongo"
              echo "    volumes:"
              echo "      - mongo_data:/data/db"
              echo "    restart: unless-stopped"
              echo ""

              echo "volumes:"
              echo "  mongo_data:"
            } > docker-compose.yml

            echo "Docker images:"
            grep "image:" docker-compose.yml


            # ---------------------------------------------------------
            # 10. Configure Nginx HTTPS
            # IMPORTANT:
            # Never fall back to HTTP-only configuration.
            # ---------------------------------------------------------

            echo "Configuring Nginx HTTPS..."

            sudo tee /etc/nginx/sites-available/ai-resume > /dev/null <<EOF
            server {
                listen 80;
                listen [::]:80;

                server_name ${DOMAIN};

                return 301 https://\$host\$request_uri;
            }

            server {
                listen 443 ssl;
                listen [::]:443 ssl;

                server_name ${DOMAIN};

                ssl_certificate ${SSL_CERT};
                ssl_certificate_key ${SSL_KEY};

                ssl_protocols TLSv1.2 TLSv1.3;

                location / {
                    proxy_pass http://127.0.0.1:5173;

                    proxy_http_version 1.1;

                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }

                location /uploads/ {
                    proxy_pass http://127.0.0.1:5000/uploads/;

                    proxy_http_version 1.1;

                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }

                location /api/ {
                    proxy_pass http://127.0.0.1:5000/api/;

                    proxy_http_version 1.1;

                    proxy_set_header Host \$host;
                    proxy_set_header X-Real-IP \$remote_addr;
                    proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto \$scheme;
                }
            }
            EOF


            # ---------------------------------------------------------
            # 11. Enable site
            # ---------------------------------------------------------

            sudo ln -sf \
              /etc/nginx/sites-available/ai-resume \
              /etc/nginx/sites-enabled/ai-resume

            sudo rm -f /etc/nginx/sites-enabled/default


            # ---------------------------------------------------------
            # 12. Validate Nginx BEFORE touching running service
            # ---------------------------------------------------------

            echo "Testing Nginx configuration..."

            sudo nginx -t


            # ---------------------------------------------------------
            # 13. Save current images for rollback
            # ---------------------------------------------------------

            echo "Saving current running images..."

            OLD_SERVER_IMAGE=$(
              docker inspect \
                --format='{{.Config.Image}}' \
                ai-resume-server 2>/dev/null || true
            )

            OLD_CLIENT_IMAGE=$(
              docker inspect \
                --format='{{.Config.Image}}' \
                ai-resume-client 2>/dev/null || true
            )


            # ---------------------------------------------------------
            # 14. Pull new images
            # ---------------------------------------------------------

            echo "Pulling new Docker images..."

            docker pull "${SERVER_IMAGE}"
            docker pull "${CLIENT_IMAGE}"

            docker compose --env-file .env pull


            # ---------------------------------------------------------
            # 15. Deploy containers
            # ---------------------------------------------------------

            echo "Starting new containers..."

            docker compose \
              --env-file .env \
              up -d \
              --pull always \
              --force-recreate \
              --remove-orphans


            # ---------------------------------------------------------
            # 16. Reload Nginx
            # IMPORTANT:
            # reload instead of restart
            # ---------------------------------------------------------

            echo "Reloading Nginx..."

            sudo nginx -t
            sudo systemctl reload nginx


            # ---------------------------------------------------------
            # 17. Verify Nginx ports
            # ---------------------------------------------------------

            echo "Checking Nginx ports..."

            sudo ss -tulpn | grep -E ':80|:443' || true

            if ! sudo ss -lntp | grep -q ':443 '; then
              echo "ERROR: Nginx is NOT listening on port 443."
              exit 1
            fi

            echo "HTTPS port 443 is listening."


            # ---------------------------------------------------------
            # 18. Server health check
            # ---------------------------------------------------------

            echo "Waiting for server to start..."

            HEALTH_OK=false

            for attempt in $(seq 1 12); do

              if curl -fsS \
                http://127.0.0.1:5000/api/health \
                >/dev/null; then

                HEALTH_OK=true
                echo "Server health check passed."
                break

              fi

              echo "Health check attempt ${attempt}/12 failed."
              echo "Retrying in 5 seconds..."

              sleep 5

            done


            # ---------------------------------------------------------
            # 19. Verify running image versions
            # ---------------------------------------------------------

            RUNNING_SERVER_IMAGE=$(
              docker inspect \
                --format='{{.Config.Image}}' \
                ai-resume-server 2>/dev/null || true
            )

            RUNNING_CLIENT_IMAGE=$(
              docker inspect \
                --format='{{.Config.Image}}' \
                ai-resume-client 2>/dev/null || true
            )

            echo "Running server image:"
            echo "${RUNNING_SERVER_IMAGE}"

            echo "Running client image:"
            echo "${RUNNING_CLIENT_IMAGE}"


            if [[ "${RUNNING_SERVER_IMAGE}" != *"${IMAGE_TAG}"* ]] || \
               [[ "${RUNNING_CLIENT_IMAGE}" != *"${IMAGE_TAG}"* ]]; then

              echo "ERROR: Wrong image tag deployed."
              exit 1

            fi


            # ---------------------------------------------------------
            # 20. Verify HTTPS externally from EC2
            # ---------------------------------------------------------

            echo "Testing HTTPS..."

            if curl -fsSI \
              --max-time 15 \
              "https://${DOMAIN}" \
              >/dev/null; then

              echo "HTTPS check passed."

            else

              echo "ERROR: HTTPS check failed."

              echo "Nginx status:"
              sudo systemctl status nginx --no-pager || true

              echo "Nginx listening ports:"
              sudo ss -tulpn | grep -E ':80|:443' || true

              echo "Nginx configuration:"
              sudo nginx -T | grep -E 'listen|server_name|ssl_certificate' || true

              exit 1

            fi


            # ---------------------------------------------------------
            # 21. Success
            # ---------------------------------------------------------

            if [ "$HEALTH_OK" = true ]; then

              echo "=========================================="
              echo "Deployment successful ✅"
              echo "HTTPS: https://${DOMAIN}"
              echo "=========================================="

              docker image prune -f

            else

              echo "=========================================="
              echo "Health check failed ❌"
              echo "Rolling back..."
              echo "=========================================="


              # -------------------------------------------------------
              # Rollback server
              # -------------------------------------------------------

              if [ -n "$OLD_SERVER_IMAGE" ]; then

                sed -i \
                  "s|image: .*ai-resume-server:.*|image: ${OLD_SERVER_IMAGE}|" \
                  docker-compose.yml

              fi


              # -------------------------------------------------------
              # Rollback client
              # -------------------------------------------------------

              if [ -n "$OLD_CLIENT_IMAGE" ]; then

                sed -i \
                  "s|image: .*ai-resume-client:.*|image: ${OLD_CLIENT_IMAGE}|" \
                  docker-compose.yml

              fi


              docker compose \
                --env-file .env \
                up -d \
                --force-recreate


              echo "Waiting after rollback..."

              sleep 10


              # -------------------------------------------------------
              # Verify rollback
              # -------------------------------------------------------

              if curl -fsS \
                http://127.0.0.1:5000/api/health \
                >/dev/null; then

                echo "Rollback successful 🔁"

              else

                echo "Rollback failed ❌"

                docker logs ai-resume-server --tail=100

                exit 1

              fi

              exit 1

            fi

